name: GitHub Flow Deployment

on:
    push:
		branches:
			- main
			- dev
			- 'release/**'
			- 'hotfix/**'
	pull_request:
		branches:
			- main
	workflow_dispatch:

permissions:
	contents: read
	packages: write

jobs:

	ci:
		name: CI
		if: github.event_name == 'pull_request'
		runs-on: ubuntu-latest
		steps:
			- name: Check out source
				uses: actions/checkout@v4
			- name: Run CI checks
				run: echo "CI checks passed"

	validate:
		name: Validate
		runs-on: ubuntu-latest
		steps:
			- name: Check out source
				uses: actions/checkout@v4
			- name: Validate workflow
				run: echo "Validation passed"

	build:
		name: Build
		needs: validate
		if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
		runs-on: ubuntu-latest
		steps:
			- name: Check out source
				uses: actions/checkout@v4
			- name: Log in to GHCR
				uses: docker/login-action@v3
				with:
					registry: ghcr.io
					username: ${{ github.actor }}
					password: ${{ secrets.GITHUB_TOKEN }}
			- name: Build and push image
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: |
					docker build --tag "$IMAGE" .
					docker push "$IMAGE"

                
	deploy-dev:
		name: Deploy to Dev
		needs: build
		if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
		runs-on: ubuntu-latest
		environment: dev
		steps:
			- uses: actions/checkout@v4
			- name: Pull image
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: docker pull "$IMAGE"
			- name: Deploy
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: echo "Deploying $IMAGE to Dev"

	deploy-qa:
		name: Deploy to QA
		needs: deploy-dev
		if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
		runs-on: ubuntu-latest
		environment: qa
		steps:
			- uses: actions/checkout@v4
			- name: Pull image
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: docker pull "$IMAGE"
			- name: Deploy
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: echo "Deploying $IMAGE to QA"

	deploy-uat:
		name: Deploy to UAT
		needs: deploy-qa
		if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
		runs-on: ubuntu-latest
		environment: uat
		steps:
			- uses: actions/checkout@v4
			- name: Pull image
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: docker pull "$IMAGE"
			- name: Deploy
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: echo "Deploying $IMAGE to UAT"

	deploy-prod:
		name: Deploy to Production
		needs: deploy-uat
		if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/')
		runs-on: ubuntu-latest
		environment: prod
		steps:
			- uses: actions/checkout@v4
			- name: Pull image
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: docker pull "$IMAGE"
			- name: Deploy
				env:
					IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
				run: echo "Deploying $IMAGE to Production"
